<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drippedia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f6f3ef; color: #2b2320;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    }
    main { width: 100%; max-width: 340px; padding: 24px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.5px; }
    p.sub { margin: 0 0 40px; color: #7a6a60; font-size: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; margin-bottom: 10px;
      border: 1px solid transparent; border-radius: 8px;
      font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .btn-google { background: #fff; color: #3c4043; border-color: #dadce0; }
    .btn-kakao { background: #fee500; color: #191600; }
    .btn-logout { background: none; color: #7a6a60; font-weight: 400; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Drippedia</h1>
  <p class="sub">핸드드립 레시피를 기록하고, 그대로 따라 내려보세요.</p>

  <div id="login" class="hidden">
    <a class="btn btn-google" data-login="google">Google로 시작하기</a>
    <a class="btn btn-kakao" data-login="kakao">카카오로 시작하기</a>
  </div>

  <div id="welcome" class="hidden">
    <p><strong id="nickname"></strong>님, 반갑습니다.</p>
    <button class="btn btn-logout" id="logout">로그아웃</button>
  </div>
</main>

<script>
  // 백엔드는 별도 오리진이라 API 주소를 명시해야 하고, 세션 쿠키를 실으려면 credentials가 필요하다.
  // ponytail: 환경 판별이 host 문자열 비교 한 줄. 배포 환경이 셋 이상 되면 빌드 타임 주입으로.
  const API = location.hostname === 'localhost' ? 'http://localhost:8080' : 'https://api.drippedia.com';

  // 소셜 로그인은 fetch가 아니라 브라우저를 백엔드로 통째로 넘겨야 한다(카카오로 리다이렉트되므로).
  document.querySelectorAll('[data-login]').forEach(a => {
    a.href = `${API}/oauth2/authorization/${a.dataset.login}`;
  });

  // 로그인 여부는 /api/me 응답 코드로만 판단한다. 200이면 세션 있음, 401이면 없음.
  fetch(`${API}/api/me`, { credentials: 'include' })
    .then(res => res.ok ? res.json() : null)
    .then(me => {
      if (me) {
        document.getElementById('nickname').textContent = me.nickname;
        document.getElementById('welcome').classList.remove('hidden');
      } else {
        document.getElementById('login').classList.remove('hidden');
      }
    });

  document.getElementById('logout').addEventListener('click', async () => {
    const token = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
    await fetch(`${API}/logout`, {
      method: 'POST',
      credentials: 'include',
      headers: token ? { 'X-XSRF-TOKEN': decodeURIComponent(token[1]) } : {}
    });
    location.reload();
  });
</script>
</body>
</html>
