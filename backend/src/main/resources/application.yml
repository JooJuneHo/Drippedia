spring:
  # 로컬 개발용. 실제 서버에서는 .env 없이 OS 환경변수를 쓰면 되고,
  # OS 환경변수가 .env보다 우선순위가 높아서 그대로 덮어쓴다.
  config:
    # 실행 위치(저장소 루트 / backend)에 따라 경로가 달라져서 둘 다 본다.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  application:
    name: drippedia

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/drippedia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Supabase 무료 플랜의 풀러는 동시 접속 수가 빠듯하다. 테스트는 컨텍스트마다 풀을 하나씩 여니
      # 기본값(10)이면 금방 한도를 넘어 "dialect를 못 정한다"는 모양으로 터진다.
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: update   # 초기 개발용. 데이터가 쌓이기 시작하면 Flyway/Liquibase로 전환 권장
    open-in-view: false  # 연관관계를 안 쓰기로 했으니 굳이 OSIV 열어둘 이유가 없음
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          # 카카오는 Spring Security 내장 provider가 아니라서 아래 provider 블록까지 직접 채워야 한다
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 프론트가 별도 오리진(app.도메인)에 배포되므로 CORS/리다이렉트 대상을 여기서 잡는다.
# cookie-domain은 프론트 JS가 XSRF-TOKEN 쿠키를 읽어야 해서 상위 도메인으로 내려주는 값.
# 로컬은 host가 localhost로 같아서(포트 달라도 쿠키 공유) 비워두면 된다.
# 프론트/백이 완전히 다른 도메인(vercel.app <-> 백엔드 호스트)이면 모든 요청이 cross-site라
# 쿠키에 SameSite=None; Secure가 없으면 브라우저가 세션 쿠키를 통째로 버린다 = 로그인이 안 붙는다.
# 로컬은 http라 Secure 쿠키를 못 써서 기본값은 lax/false.
server:
  # Render 같은 호스트는 PORT로 포트를 지정해 준다. 로컬은 그대로 8080.
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-domain: ${COOKIE_DOMAIN:}

# 배포에서는 SQL_LOG_LEVEL=off. 느린 데다 bind 로그에 값이 그대로 찍힌다.
logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}
    org.hibernate.orm.jdbc.bind: ${SQL_LOG_LEVEL:trace}
